<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cascoi — Furniture & Interior Design</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&display=swap">
  <style>
    html, body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Figtree', sans-serif; }
    .scroll-trigger { opacity: 1 !important; transform: none !important; }

    #CreativeConversion {
      background: #000; color: #fff;
      padding-top: 80px; padding-bottom: 120px;
      overflow: hidden; position: relative;
    }

    #CreativeConversion .cc-grid-bg {
      position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    #CreativeConversion .cc-grid-square {
      position: absolute; width: 48px; height: 48px;
      background: rgba(255,255,255,0.035); opacity: 0;
      transition: opacity 1.5s ease;
    }
    #CreativeConversion .cc-grid-square.active { opacity: 1; }

    #CreativeConversion .cc-grid-line {
      position: absolute; opacity: 0; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    }
    #CreativeConversion .cc-grid-line.is-horizontal { width: 200px; height: 1px; }
    #CreativeConversion .cc-grid-line.is-vertical {
      width: 1px; height: 200px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.22), transparent);
    }

    #CreativeConversion .cc-inner {
      position: relative; z-index: 2; max-width: 1600px; margin: 0 auto; padding: 0 20px;
    }

    #CreativeConversion .cc-heading {
      text-align: center;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.15; font-weight: 800;
      margin: 0 0 120px; letter-spacing: -0.04em;
    }
    #CreativeConversion .cc-highlight { color: #0096fc; display: block; }

    #CreativeConversion .cc-gallery { display: grid; gap: 18px; align-items: start; }
    #CreativeConversion .cc-gallery-desktop { grid-template-columns: repeat(5, 1fr); }
    #CreativeConversion .cc-gallery-mobile { display: none; }

    #CreativeConversion .cc-column {
      display: flex; flex-direction: column; gap: 18px;
      align-self: start; will-change: transform;
    }
    #CreativeConversion .cc-gallery-desktop .cc-column:nth-child(even) { margin-top: 120px; }

    #CreativeConversion .cc-card {
      border-radius: 8px; overflow: hidden;
      background: rgba(255,255,255,.04);
      opacity: 0; transform: translateY(70px) scale(.98);
      transition: opacity 800ms ease, transform 800ms ease;
    }
    #CreativeConversion .cc-card.is-visible { opacity: 1; transform: translateY(0) scale(1); }

    #CreativeConversion .cc-card-button {
      display: block; width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer;
    }
    #CreativeConversion .cc-card img { display: block; width: 100%; height: auto; }

    #CreativeConversion .cc-card.cc-square img { aspect-ratio: 1 / 1; object-fit: cover; }
    #CreativeConversion .cc-card.cc-wide img   { aspect-ratio: 16 / 10; object-fit: cover; }
    #CreativeConversion .cc-card.cc-short img  { aspect-ratio: 4 / 3; object-fit: cover; }
    #CreativeConversion .cc-card.cc-tall img   { height: auto; object-fit: contain; }

    #CreativeConversion .cc-popup {
      position: fixed; inset: 0; z-index: 999999;
      display: none; align-items: center; justify-content: center;
      padding: 24px; background: rgba(0,0,0,.84);
    }
    #CreativeConversion .cc-popup.is-open { display: flex; }
    #CreativeConversion .cc-popup-content { position: relative; max-width: min(92vw, 980px); max-height: 90vh; }
    #CreativeConversion .cc-popup-img {
      display: block; max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 10px;
    }
    #CreativeConversion .cc-popup-close {
      position: absolute; top: -44px; right: 0;
      width: 38px; height: 38px; border: 0; border-radius: 999px;
      background: #fff; color: #000; cursor: pointer;
      font-size: 26px; line-height: 38px;
    }

    @media (max-width: 989px) {
      #CreativeConversion .cc-gallery-desktop { grid-template-columns: repeat(3, 1fr); }
      #CreativeConversion .cc-gallery-desktop .cc-column:nth-child(even) { margin-top: 80px; }
    }

    @media (max-width: 749px) {
      #CreativeConversion { padding-top: 60px; padding-bottom: 20px; }
      #CreativeConversion .cc-inner { padding: 0; }
      #CreativeConversion .cc-heading { padding: 0 20px; }
      #CreativeConversion .cc-gallery-desktop { display: none; }
      #CreativeConversion .cc-gallery-mobile {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 10px; width: 150%; margin-left: -25%; align-items: start;
      }
      #CreativeConversion .cc-gallery-mobile .cc-column {
        gap: 10px; margin-top: 0 !important; transition: transform 0.08s linear;
      }
      #CreativeConversion .cc-popup { padding: 14px; }
    }
  </style>
</head>
<body>

<section id="CreativeConversion">
  <div class="cc-grid-bg" id="cc-grid-bg" aria-hidden="true"></div>
  <div class="cc-inner">
    <h2 class="cc-heading">
      Creative Built for
      <span class="cc-highlight">Cascoi Furniture designs Kitchens and Desks and Sideboards and Meeting Tables and Cabinets and TV+Units and Credenzas</span>
    </h2>

    <div class="cc-gallery cc-gallery-desktop" id="cc-gallery-desktop"></div>
    <div class="cc-gallery cc-gallery-mobile" id="cc-gallery-mobile"></div>
  </div>

  <div class="cc-popup" aria-hidden="true">
    <div class="cc-popup-content">
      <button type="button" class="cc-popup-close" aria-label="Close popup">×</button>
      <img class="cc-popup-img" src="" alt="">
    </div>
  </div>
</section>

  const SHAPES = ['square','tall','square','tall'];
  const IMAGES = FILES.map((file, i) => ({ file, shape: SHAPES[i % SHAPES.length] }));

  const encode = (name) => BASE + encodeURIComponent(name);

  function cardHTML(item, delay) {
    const src = encode(item.file);
    return `
      <div class="cc-card cc-${item.shape}" style="transition-delay:${delay}ms">
        <button type="button" class="cc-card-button" data-popup-image="${src}" aria-label="Open image">
          <img src="${src}" alt="" loading="lazy" decoding="async">
        </button>
      </div>`;
  }

  function buildColumns(container, colCount) {
    const total = IMAGES.length;
    const base = Math.floor(total / colCount);
    const remainder = total % colCount;
    const buckets = Array.from({ length: colCount }, () => []);
    let idx = 0;
    for (let c = 0; c < colCount; c++) {
      const count = base + (c < remainder ? 1 : 0);
      for (let k = 0; k < count; k++) {
        buckets[c].push(IMAGES[idx++]);
      }
    }

    container.innerHTML = buckets
      .map((list, ci) => `
        <div class="cc-column">
          ${list.map((item, i) => cardHTML(item, (ci * 40) + (i * 60))).join('')}
        </div>`)
      .join('');
  }

  buildColumns(document.getElementById('cc-gallery-desktop'), 5);
  buildColumns(document.getElementById('cc-gallery-mobile'), 3);

  const cards = section.querySelectorAll('.cc-card');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add('is-visible'); });
  }, { threshold: 0.2, rootMargin: '0px 0px -8% 0px' });
  cards.forEach((c) => observer.observe(c));

  const mobileColumns = section.querySelectorAll('.cc-gallery-mobile .cc-column');
  function mobileParallax() {
    if (window.innerWidth > 749) {
      mobileColumns.forEach((col) => (col.style.transform = ''));
      return;
    }
    const rect = section.getBoundingClientRect();
    const wh = window.innerHeight;
    const progress = Math.min(Math.max((wh - rect.top) / (wh + rect.height), 0), 1);
    mobileColumns.forEach((col, i) => {
      const speed = i === 1 ? 20 : 60;
      col.style.transform = `translateY(${progress * speed * -1}px)`;
    });
  }
  mobileParallax();
  window.addEventListener('scroll', mobileParallax, { passive: true });
  window.addEventListener('resize', mobileParallax);

  const popup = section.querySelector('.cc-popup');
  const popupImg = section.querySelector('.cc-popup-img');
  const popupClose = section.querySelector('.cc-popup-close');

  function openPopup(src) {
    popupImg.src = src;
    popup.classList.add('is-open');
    popup.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
  }
  function closePopup() {
    popup.classList.remove('is-open');
    popup.setAttribute('aria-hidden', 'true');
    popupImg.src = '';
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }
  section.querySelectorAll('[data-popup-image]').forEach((b) =>
    b.addEventListener('click', () => openPopup(b.dataset.popupImage))
  );
  popupClose.addEventListener('click', closePopup);
  popup.addEventListener('click', (e) => { if (e.target === popup) closePopup(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopup(); });

  const ccGrid = section.querySelector('#cc-grid-bg');
  const GRID = 48;
  let squares = [];

  function buildSquares() {
    ccGrid.querySelectorAll('.cc-grid-square').forEach((el) => el.remove());
    squares = [];
    const cols = Math.ceil(ccGrid.offsetWidth / GRID);
    const rows = Math.ceil(ccGrid.offsetHeight / GRID);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const s = document.createElement('span');
        s.className = 'cc-grid-square';
        s.style.left = `${x * GRID}px`;
        s.style.top = `${y * GRID}px`;
        ccGrid.appendChild(s);
        squares.push(s);
      }
    }
    randomizeSquares();
  }

  function randomizeSquares() {
    squares.forEach((s) => s.classList.remove('active'));
    const active = 8;
    const chosen = [];
    const shuffled = [...squares].sort(() => 0.5 - Math.random());
    const farEnough = (sq) => {
      const x1 = parseInt(sq.style.left, 10);
      const y1 = parseInt(sq.style.top, 10);
      return chosen.every((e) => {
        const x2 = parseInt(e.style.left, 10);
        const y2 = parseInt(e.style.top, 10);
        return Math.abs(x1 - x2) > GRID || Math.abs(y1 - y2) > GRID;
      });
    };
    for (const sq of shuffled) {
      if (chosen.length >= active) break;
      if (farEnough(sq)) { sq.classList.add('active'); chosen.push(sq); }
    }
  }

  function createLine() {
    const line = document.createElement('span');
    const horizontal = Math.random() > 0.5;
    line.className = `cc-grid-line ${horizontal ? 'is-horizontal' : 'is-vertical'}`;
    const cols = Math.floor(ccGrid.offsetWidth / GRID);
    const rows = Math.floor(ccGrid.offsetHeight / GRID);
    line.style.left = `${Math.floor(Math.random() * cols) * GRID}px`;
    line.style.top  = `${Math.floor(Math.random() * rows) * GRID}px`;
    ccGrid.appendChild(line);
    const travel = horizontal ? ccGrid.offsetWidth : ccGrid.offsetHeight;
    const keyframes = horizontal
      ? [{ transform: `translateX(-${travel}px)`, opacity: 0 },
         { transform: 'translateX(0px)', opacity: 1, offset: 0.15 },
         { transform: `translateX(${travel}px)`, opacity: 0 }]
      : [{ transform: `translateY(-${travel}px)`, opacity: 0 },
         { transform: 'translateY(0px)', opacity: 1, offset: 0.15 },
         { transform: `translateY(${travel}px)`, opacity: 0 }];
    line.animate(keyframes, { duration: 5500, easing: 'linear' });
    setTimeout(() => line.remove(), 5600);
  }

  buildSquares();
  setInterval(randomizeSquares, 5000);
  setInterval(() => { createLine(); createLine(); }, 2200);
})();
</script>
</body>
</html>
